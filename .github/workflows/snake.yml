name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            icons/github-snake.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            icons/github-snake-light.svg?palette=github-light&color_snake=#0969da

      - name: Crop progress bar
        run: |
          sed -Ei 's/^<svg viewBox="-16 -32 ([0-9]+) 192" width="([0-9]+)" height="192"/<svg viewBox="-16 -16 \1 144" width="\2" height="144"/' icons/github-snake.svg icons/github-snake-light.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/github-snake.svg icons/github-snake-light.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
